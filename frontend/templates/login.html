<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Market Price Manipulation Detection System</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-container {
            background: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);

            text-align: center;
        }

        h1 {
            color: #172033;
            font-size: 25px;
            margin-bottom: 10px;
        }

        h2 {
            color: #2563eb;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-bottom: 7px;
            color: #334155;
        }

        input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin-bottom: 18px;

            border: 1px solid #cbd5e1;
            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 6px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>
            Smart Market Price Manipulation Detection System
        </h1>

        <p class="subtitle">
            Market Monitoring & Risk Analysis
        </p>

        <h2>Login</h2>

        <!-- IMPORTANT: POST goes to / -->
        <form action="/" method="post">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
